<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shift Bord CPanel | Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#b7c4ff",
            "outline": "#8d90a2",
            "primary-container": "#0052ff",
            "surface-bright": "#353942",
            "error-container": "#93000a",
            "surface-tint": "#b7c4ff",
            "surface-container-low": "#181c24",
            "surface": "#0f131c",
            "secondary-container": "#00eefc",
            "surface-container-high": "#262a33",
            "surface-container": "#1c2028",
            "on-background": "#dfe2ee",
            "surface-container-highest": "#31353e",
            "on-surface": "#dfe2ee",
            "surface-container-lowest": "#0a0e16",
            "outline-variant": "#434656"
          },
          fontFamily: {
            body: ["Hanken Grotesk"],
            headline: ["Space Grotesk"],
            mono: ["JetBrains Mono"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-6 selection:bg-primary-container selection:text-white">

  <!-- Background flare glow -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-primary-container/20 rounded-full blur-[130px] pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-secondary-container/15 rounded-full blur-[130px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="p-8 sm:p-10 rounded-2xl bg-surface-container shadow-2xl border border-outline-variant/30 space-y-8">
      
      <!-- Brand & Header -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high border border-outline-variant/40 text-[11px] font-mono uppercase tracking-widest text-primary mb-2">
          <span class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></span>
          <span>SHIFT BORD · CONTROL PANEL</span>
        </div>
        <h1 class="text-2xl font-bold font-headline text-on-surface tracking-tight">Admin Authentication</h1>
        <p class="text-sm text-outline">Manage leads, inquiries, and system operations</p>
      </div>

      <!-- Error message banner -->
      <div id="error-box" class="hidden p-3.5 rounded-lg bg-error-container/20 border border-error-container/50 text-red-300 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span id="error-text">Invalid credentials.</span>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-5">
        <div class="space-y-2">
          <label class="block text-xs font-mono uppercase tracking-wider text-outline font-semibold">Username</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-[18px] text-outline">person</span>
            <input type="text" id="username" name="username" required autofocus placeholder="admin"
              class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-surface-container-low text-on-surface border border-outline-variant/40 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body text-sm" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-mono uppercase tracking-wider text-outline font-semibold">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-[18px] text-outline">lock</span>
            <input type="password" id="password" name="password" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-surface-container-low text-on-surface border border-outline-variant/40 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body text-sm" />
          </div>
        </div>

        <!-- Default Credentials Notice -->
        <div class="p-3 rounded-lg bg-surface-container-low border border-outline-variant/20 text-xs text-outline space-y-1">
          <div class="flex items-center gap-1.5 text-secondary-container font-mono font-semibold">
            <span class="material-symbols-outlined text-[14px]">info</span>
            <span>Default Setup Credentials</span>
          </div>
          <div class="font-mono text-[11px] text-gray-300">
            Username: <span class="text-primary">admin</span> &nbsp;|&nbsp; Password: <span class="text-primary">shiftbord2026</span>
          </div>
        </div>

        <button type="submit" id="login-btn"
          class="w-full py-3 rounded-lg bg-primary-container text-white font-headline text-sm font-semibold hover:bg-blue-600 transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(0,82,255,0.4)]">
          <span>Sign In to CPanel</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
      </form>

      <!-- Back to website link -->
      <div class="text-center pt-2">
        <a href="/" class="text-xs text-outline hover:text-primary transition-colors flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-[14px]">arrow_back</span>
          <span>Back to Public Landing Page</span>
        </a>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>Verifying...</span>';

      const username = form.username.value.trim();
      const password = form.password.value;

      try {
        const res = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errorText.textContent = data.message || 'Invalid username or password';
          errorBox.classList.remove('hidden');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Sign In to CPanel</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
        }
      } catch (err) {
        errorText.textContent = 'Server connection error. Please try again.';
        errorBox.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Sign In to CPanel</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      }
    });
  </script>
</body>
</html>
