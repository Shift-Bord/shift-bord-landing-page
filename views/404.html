<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 – Page Not Found | Shift Bord</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Hanken+Grotesk:ital,wght@0,300..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body { background:#0f131c; color:#dfe2ee; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Hanken Grotesk',sans-serif; }
  </style>
</head>
<body>
  <div class="text-center space-y-6 px-6">
    <div class="text-[96px] font-black text-transparent bg-clip-text bg-gradient-to-r from-[#b7c4ff] via-[#00eefc] to-[#dde1ff] leading-none">404</div>
    <h1 class="text-2xl font-bold" style="font-family:'Space Grotesk',sans-serif;">Page Not Found</h1>
    <p class="text-[#c3c5d9] max-w-sm mx-auto">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-lg bg-[#0052ff] text-[#dfe3ff] font-semibold hover:bg-[#b7c4ff] hover:text-[#002682] transition-all">
      <span class="material-symbols-outlined text-[18px]">home</span>
      Back to Home
    </a>
  </div>

</html>
